name: SmartBooking CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartbooking_db
          POSTGRES_USER: smartbooking
          POSTGRES_PASSWORD: smartbooking_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smartbooking -d smartbooking_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartbooking_db
          SPRING_DATASOURCE_USERNAME: smartbooking
          SPRING_DATASOURCE_PASSWORD: smartbooking_pass
        run: ./mvnw -B clean test